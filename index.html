<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CERDAS - Administrasi Sekolah</title>
    <meta name="description" content="Catatan Edukasi, Rapor, & Data Administrasi Sekolah" />
    <meta property="og:title" content="CERDAS - Administrasi Sekolah" />
    <meta property="og:description" content="Catatan Edukasi, Rapor, & Data Administrasi Sekolah" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var key = 'cerdas_theme';
          var stored = localStorage.getItem(key);
          var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e293b;
        z-index: 9999;
      }
      .dark #app-preloader {
        background-color: #020617;
        color: #f8fafc;
      }
      .preloader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      .dark .preloader-spinner {
        border-color: #1e293b;
        border-top-color: #6366f1;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-150">
    <div id="root">
      <div id="app-preloader">
        <div class="preloader-spinner"></div>
        <p style="margin-top: 14px; font-size: 14px; font-weight: 600; color: #475569;">Memuat CERDAS...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
